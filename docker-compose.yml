version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/enterprise-ai/uploads
      - ./vectorstore:/enterprise-ai/vectorstore
      - ./enterprise_ai.db:/enterprise-ai/enterprise_ai.db
    env_file:
      - .env
    restart: unless-stopped

